<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BILL DESK - Payment</title>

    <link rel="stylesheet" href="style.css">

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<div class="container">

    <h1>PAYMENT</h1>

    <div class="card">

        <h3>Order Summary</h3>

        <div class="summary">

            <p>
                <span>Product</span>
                <strong id="product"></strong>
            </p>

            <p>
                <span>Price / KG</span>
                <strong id="price"></strong>
            </p>

            <p>
                <span>Quantity</span>
                <strong id="quantity"></strong>
            </p>

            <hr>

            <p class="grand-total">
                <span>Total</span>
                <strong id="total"></strong>
            </p>

        </div>

        <button id="payButton" onclick="payNow()">
            PAY NOW
        </button>

        <button class="back-button" onclick="goBack()">
            ← BACK
        </button>

    </div>

</div>

<script>

const order = JSON.parse(localStorage.getItem("shopOrder"));

if (!order) {

    alert("No order found.");

    window.location.href = "index.html";

} else {

    document.getElementById("product").textContent =
        order.product;

    document.getElementById("price").textContent =
        "₹" + order.price.toFixed(2);

    document.getElementById("quantity").textContent =
        order.quantity + " " + order.unit;

    document.getElementById("total").textContent =
        "₹" + order.total.toFixed(2);

}


// =====================================
// START RAZORPAY PAYMENT
// =====================================

async function payNow() {

    const phone = prompt(
        "Enter your 10-digit mobile number:"
    );

    if (!phone || !/^[6-9]\d{9}$/.test(phone)) {

        alert(
            "Please enter a valid 10-digit mobile number."
        );

        return;
    }

    const payButton =
        document.getElementById("payButton");

    payButton.disabled = true;
    payButton.textContent = "CREATING ORDER...";

    try {

        // Create Razorpay order on our server
        const response = await fetch("/create-order", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                amount: order.total,

                phone: phone,

                product: order.product,

                quantity: order.quantity,

                unit: order.unit

            })

        });


        const data = await response.json();


        if (!data.success) {

            alert(
                data.message ||
                "Unable to create payment order."
            );

            payButton.disabled = false;
            payButton.textContent = "PAY NOW";

            return;
        }


        // =====================================
        // RAZORPAY CHECKOUT
        // =====================================

        const options = {

            key: data.keyId,

            amount: data.amount,

            currency: data.currency,

            name: "BILL DESK",

            description: "Bill Desk Payment",

            order_id: data.orderId,


            prefill: {

                contact: phone

            },


            theme: {

                color: "#3399cc"

            },


            handler: async function (paymentResponse) {

                console.log(
                    "Razorpay payment response:",
                    paymentResponse
                );


                // Verify payment on our server
                try {

                    const verifyResponse =
                        await fetch("/verify-payment", {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                razorpay_order_id:
                                    paymentResponse.razorpay_order_id,

                                razorpay_payment_id:
                                    paymentResponse.razorpay_payment_id,

                                razorpay_signature:
                                    paymentResponse.razorpay_signature

                            })

                        });


                    const verifyData =
                        await verifyResponse.json();


                    if (verifyData.success) {

                        document.body.innerHTML = `

                            <div style="
                                text-align:center;
                                margin-top:100px;
                                font-family:Arial;
                            ">

                                <h1>
                                    ✅ Payment Successful!
                                </h1>

                                <h2>
                                    ₹${order.total.toFixed(2)}
                                </h2>

                                <p>
                                    Thank you for your order.
                                </p>

                                <p>
                                    Payment ID:
                                    ${verifyData.paymentId}
                                </p>

                                <button
                                    onclick="window.location.href='index.html'"
                                >
                                    Back to Home
                                </button>

                            </div>

                        `;

                    } else {

                        alert(
                            "Payment was received, but verification failed. Please contact us."
                        );

                    }

                } catch (error) {

                    console.error(
                        "Verification error:",
                        error
                    );

                    alert(
                        "Payment verification could not be completed."
                    );

                }

            },


            modal: {

                ondismiss: function () {

                    payButton.disabled = false;
                    payButton.textContent = "PAY NOW";

                }

            }

        };


        const razorpay =
            new Razorpay(options);


        razorpay.on(
            "payment.failed",
            function (response) {

                console.error(
                    "Razorpay payment failed:",
                    response.error
                );

                alert(
                    "Payment failed. Please try again."
                );

                payButton.disabled = false;
                payButton.textContent = "PAY NOW";

            }
        );


        razorpay.open();


    } catch (error) {

        console.error(
            "Payment error:",
            error
        );

        alert(
            "Payment could not be started."
        );

        payButton.disabled = false;
        payButton.textContent = "PAY NOW";

    }

}


// =====================================
// BACK BUTTON
// =====================================

function goBack() {

    window.location.href = "index.html";

}

</script>

</body>
</html>
